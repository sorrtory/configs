# External runtime assets managed by ./manager.sh.
#
# Format:
#   git-dir|name|repo|ref|target|optional_comma_separated_sparse_paths
#   git-dir-link|name|repo|ref|clone_target|link_target
#   path-link|name|||source_inside_clone|link_target
#
# Paths support $HOME, $XDG_DATA_HOME, $XDG_STATE_HOME, and
# ${XDG_CONFIG_HOME:-$HOME/.config}.
# ref can be a branch, tag, or commit. Use a commit for strict pinning.
git-dir|tmux:tpm|https://github.com/tmux-plugins/tpm|e261deb1b47614eed3400089ce7197dc68acc4eb|$XDG_DATA_HOME/configs-manager/tmux/plugins/tpm
git-dir|tmux:tmux-sensible|https://github.com/tmux-plugins/tmux-sensible|25cb91f42d020f675bb0a2ce3fbd3a5d96119efa|$XDG_DATA_HOME/configs-manager/tmux/plugins/tmux-sensible
git-dir|tmux:tmux-resurrect|https://github.com/tmux-plugins/tmux-resurrect|cff343cf9e81983d3da0c8562b01616f12e8d548|$XDG_DATA_HOME/configs-manager/tmux/plugins/tmux-resurrect
git-dir|tmux:tmux-continuum|https://github.com/tmux-plugins/tmux-continuum|0698e8f4b17d6454c71bf5212895ec055c578da0|$XDG_DATA_HOME/configs-manager/tmux/plugins/tmux-continuum

